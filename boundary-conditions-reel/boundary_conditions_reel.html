(() => {
const W = 1080, H = 1920, DUR = 15, BPM = 96, BT = 60/BPM;

const SERIF = '"Noto Serif JP", serif', SANS = '"Noto Sans JP", sans-serif', MONO = '"JetBrains Mono", monospace';

const c = (rgb, a) => `rgba(${rgb},${a})`;

function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const eOut = u => 1 - Math.pow(1-u,4);
const eIO = u => u<.5 ? 8*u*u*u*u : 1 - Math.pow(-2*u+2,4)/2;
const pulse = (t, at, k) => t < at ? 0 : Math.exp(-(t-at)*k);
const win = (t, a, bb, f = .25) => sm(seg(t, a, a + f)) * (1 - sm(seg(t, bb - f, bb)));

// ---------------- timeline ----------------
const T_OPEN = 0, T_TWO = b(4), T_GAP = b(8), T_MIO = b(12), T_TITLE = b(18);

// ---------------- photos: 9:16 crops [img, sx, sy, sw, sh] ----------------
const img = {};
const SHOTS = [
  ['main', 380, 0, 631, 1122],          // hero portrait
  ['grid', 690, 0, 201, 358],           // profile
  ['grid', 600, 365, 222, 395],         // reading a sheet
  ['grid', 1085, 458, 170, 302],        // looking up
  ['grid', 580, 768, 199, 354],         // eyes down
  ['grid', 80, 365, 222, 395],          // facing us
];
const graded = [];
function prep(){
  for (const [k, sx, sy, sw, sh] of SHOTS) { const im = img[k]; const [x, g] = mk(540, 960);
    if (im) { g.filter = 'grayscale(.35) contrast(1.2) brightness(.9) sepia(.12) hue-rotate(170deg) saturate(.8)'; g.drawImage(im, sx, sy, sw, sh, 0, 0, 540, 960); }
    graded.push(x); }
}
function mk(w,h){ const x = document.createElement('canvas'); x.width = w; x.height = h; return [x, x.getContext('2d')]; }

// ---------------- common ----------------
function base(t, a = 1){
  ctx.fillStyle = '#07090d'; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = c(STEEL, .05); ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 54) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y <= H; y += 54) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.restore();
}
function hud(t, tag){
  ctx.save(); ctx.font = `500 22px ${MONO}`; ctx.fillStyle = c(STEEL, .7); ctx.textAlign = 'left';
  ctx.fillText('SHINONOME HEAVY IND. / TECH REVIEW BOARD', 60, 90);
  ctx.textAlign = 'right'; ctx.fillText(`CASE 01  ${tag}`, W - 60, 90);
  ctx.textAlign = 'left'; ctx.fillText(`T+${t.toFixed(2)}s`, 60, H - 70);
  ctx.textAlign = 'right'; ctx.fillStyle = c(RED, .5 + .5*(Math.floor(t*2) % 2)); ctx.fillText('REC', W - 60, H - 70);
  ctx.restore();
}
function type(txt, x, y, t, t0, cps, font, col, align = 'center'){
  const n = Math.floor(clamp((t - t0)*cps, 0, txt.length)); if (n <= 0) return 0;
  ctx.save(); ctx.font = font; ctx.textAlign = align; ctx.fillStyle = col; ctx.fillText(txt.slice(0, n), x, y); ctx.restore(); return n;
}
function textAt(txt, x, y, a, font, col, align = 'center', glow){
  if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.font = font; ctx.textAlign = align;
  if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 24; } ctx.fillStyle = col; ctx.fillText(txt, x, y + (1-a)*10); ctx.restore();
}
function scope(t, y0, amp, col, lw = 3, speed = 3, noise = 0, x0 = 0, x1 = W){
  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.shadowColor = col; ctx.shadowBlur = 14; ctx.beginPath();
  const r = rng(Math.floor(t*30) + y0);
  for (let x = x0; x <= x1; x += 4) { const u = x/W;
    const y = y0 + Math.sin(u*28 - t*speed)*amp*.6 + Math.sin(u*71 + t*speed*1.7)*amp*.25 + (r() - .5)*noise;
    x === x0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
  ctx.stroke(); ctx.restore();
}

// ---------------- 1. open: "事故は、誰のせいでもなかった。" ----------------
function open(t){
  base(t, seg(t, 0, .6));
  scope(t, 1180, 26 + 60*pulse(t, b(2), 3), c(CYAN, .8*seg(t, .2, .8)), 3, 4, 3);
  type('事故は、', W/2, 820, t, .45, 10, `900 96px ${SERIF}`, c(WHITE, 1));
  type('誰のせいでもなかった。', W/2, 960, t, b(2), 12, `900 84px ${SERIF}`, c(WHITE, 1));
  const cur = Math.floor(t*4) % 2 === 0; if (cur && t < b(4) - .2) { ctx.fillStyle = c(RED, 1); ctx.fillRect(W/2 + 360, t < b(2) ? 740 : 880, 8, 96); }
  hud(t, 'INCIDENT');
}

// ---------------- 2. two correct judgements ----------------
function drawing(g, x0, y0, w, h, t, col){                        // procedural engineering drawing
  g.save(); g.strokeStyle = col; g.lineWidth = 2;
  g.strokeRect(x0, y0, w, h);
  const cx = x0 + w*.5;
  g.beginPath(); g.rect(cx - 90, y0 + 60, 180, h - 120); g.moveTo(cx - 90, y0 + 150); g.lineTo(cx + 90, y0 + 150);
  g.rect(cx - 150, y0 + h*.45, 300, 70); g.moveTo(cx, y0 + 30); g.lineTo(cx, y0 + h - 30); g.stroke();
  g.setLineDash([10, 8]); g.beginPath(); g.moveTo(x0 + 60, y0 + h*.45); g.lineTo(x0 + w - 60, y0 + h*.45); g.stroke(); g.setLineDash([]);
  g.lineWidth = 1; for (let i = 0; i < 12; i++) { g.beginPath(); g.moveTo(cx - 150 + i*25, y0 + h*.45); g.lineTo(cx - 130 + i*25, y0 + h*.45 + 70); g.stroke(); }
  g.beginPath(); g.moveTo(x0 + 40, y0 + 60); g.lineTo(x0 + 40, y0 + h - 60); g.moveTo(x0 + 30, y0 + 60); g.lineTo(x0 + 50, y0 + 60); g.moveTo(x0 + 30, y0 + h - 60); g.lineTo(x0 + 50, y0 + h - 60); g.stroke();
  g.font = `500 20px ${MONO}`; g.fillStyle = col; g.fillText('TOL +/-0.02', x0 + 60, y0 + 40); g.fillText('REV C', x0 + w - 120, y0 + h - 20);
  g.restore();
}
function panel(t, y, label, sub, kind, stampAt, col){
  const x0 = 70, w = W - 140, h = 520;
  ctx.save(); ctx.fillStyle = 'rgba(12,16,24,.92)'; ctx.fillRect(x0, y, w, h); ctx.strokeStyle = c(col, .7); ctx.lineWidth = 2; ctx.strokeRect(x0, y, w, h);
  ctx.font = `500 22px ${MONO}`; ctx.fillStyle = c(col, .9); ctx.textAlign = 'left'; ctx.fillText(sub, x0 + 24, y + 40);
  ctx.font = `700 40px ${SANS}`; ctx.fillStyle = c(WHITE, 1); ctx.fillText(label, x0 + 24, y + 92);
  if (kind === 'draw') drawing(ctx, x0 + 40, y + 120, w - 80, h - 150, t, c(col, .8));
  else { ctx.save(); ctx.beginPath(); ctx.rect(x0, y + 110, w, h - 120); ctx.clip();
    for (let i = 0; i < 3; i++) scope(t + i, y + 220 + i*100, 30 - i*6, c(col, .9 - i*.25), 2.5, 3 + i, 2, x0 + 20, x0 + w - 20);
    ctx.restore(); }
  // stamp
  const s = seg(t, stampAt, stampAt + .12);
  if (s > 0) { ctx.save(); ctx.translate(x0 + w - 190, y + 90); ctx.rotate(-.12); ctx.scale(lerp(1.8, 1, eOut(s)), lerp(1.8, 1, eOut(s))); ctx.globalAlpha = s;
    ctx.strokeStyle = c(CYAN, 1); ctx.lineWidth = 5; ctx.strokeRect(-150, -48, 300, 96);
    ctx.font = `700 42px ${SANS}`; ctx.fillStyle = c(CYAN, 1); ctx.textAlign = 'center'; ctx.fillText('判断：正しい', 0, 15); ctx.restore(); }
  ctx.restore();
}
function two(t){
  base(t);
  const m = eIO(seg(t, T_GAP, T_GAP + b(1.5)));                  // panels close in, leaving a sliver
  const yA = lerp(260, 420, m), yB = lerp(1040, 986, m);          // closes to a 46px sliver nobody owns
  const gapTop = yA + 520, gapBot = yB;
  panel(t, yA, '航空機事業部', 'DIV.A  AIRFRAME / STRUCTURE', 'draw', T_TWO + b(1), STEEL);
  panel(t, yB, '宇宙機器事業部', 'DIV.S  SPACE / CONTROL', 'wave', T_TWO + b(2), AMBER);
  // the gap between two correct scopes
  if (t >= T_GAP) {
    const g = sm(seg(t, T_GAP + b(1), T_GAP + b(2)));
    const mid = (gapTop + gapBot)/2, hh = Math.max(6, gapBot - gapTop);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const rg = ctx.createLinearGradient(0, mid - 120, 0, mid + 120); rg.addColorStop(0, c(RED, 0)); rg.addColorStop(.5, c(RED, .55*g)); rg.addColorStop(1, c(RED, 0));
    ctx.fillStyle = rg; ctx.fillRect(0, mid - 120, W, 240);
    ctx.strokeStyle = c(RED, g); ctx.lineWidth = 3; ctx.setLineDash([16, 10]); ctx.lineDashOffset = -t*60;
    ctx.beginPath(); ctx.moveTo(0, gapTop + 1); ctx.lineTo(W, gapTop + 1); ctx.moveTo(0, gapBot - 1); ctx.lineTo(W, gapBot - 1); ctx.stroke(); ctx.setLineDash([]);
    ctx.restore();
    if (g > 0) { ctx.save(); ctx.globalAlpha = g; ctx.font = `500 22px ${MONO}`; ctx.fillStyle = c(RED, 1); ctx.textAlign = 'left'; ctx.fillText(`UNASSIGNED  ${Math.max(0, hh).toFixed(0)}px`, 80, mid + 8);
      ctx.textAlign = 'right'; ctx.font = `700 30px ${SANS}`; ctx.fillText('担当者：なし', W - 80, mid + 11); ctx.restore(); }
  }
  // captions
  textAt('二つの正しさが重なった瞬間、', W/2, 200, win(t, T_GAP + b(.3), T_MIO, .3), `900 60px ${SERIF}`, c(WHITE, 1));
  textAt('隙間が見える。', W/2, 1720, win(t, T_GAP + b(2), T_MIO, .25), `900 96px ${SERIF}`, c(RED, 1), 'center', c(RED, .8));
  hud(t, t < T_GAP ? 'JUDGEMENT' : 'BOUNDARY');
}

// ---------------- 3. Mio ----------------
const CAPS = [['図面と、波形と、', 0], ['人の沈黙を、', 2], ['同じ解像度で読む。', 4]];
function mio(t){
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
  const k = Math.min(5, Math.floor((t - T_MIO)/BT)), u = (t - T_MIO - k*BT)/BT;
  const order = [1, 2, 3, 4, 5, 0], im = graded[order[k]];
  const z = lerp(1.12, 1.0, eOut(clamp(u))) + (k === 5 ? .05*u : 0);
  if (im) { ctx.save(); ctx.translate(W/2, H/2); ctx.scale(z, z); ctx.drawImage(im, -W/2, -H/2, W, H); ctx.restore(); }
  // cold grade + letterbox + scan
  ctx.fillStyle = 'rgba(10,20,35,.25)'; ctx.fillRect(0,0,W,H);
  let g = ctx.createLinearGradient(0, H*.55, 0, H); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.9)'); ctx.fillStyle = g; ctx.fillRect(0, H*.55, W, H*.45);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, 130); ctx.fillRect(0, H - 130, W, 130);
  // focus brackets drift over the frame
  const bx = W/2 + Math.sin(t*2 + k)*60, by = H*.36 + Math.cos(t*1.7 + k)*40, bs = lerp(260, 200, eOut(clamp(u*2)));
  ctx.save(); ctx.strokeStyle = c(RED, .9); ctx.lineWidth = 3; const L = 40;
  for (const [sx, sy] of [[-1,-1],[1,-1],[-1,1],[1,1]]) { ctx.beginPath(); ctx.moveTo(bx + sx*bs, by + sy*bs*.6 - sy*L); ctx.lineTo(bx + sx*bs, by + sy*bs*.6); ctx.lineTo(bx + sx*bs - sx*L, by + sy*bs*.6); ctx.stroke(); }
  ctx.font = `500 20px ${MONO}`; ctx.fillStyle = c(RED, .9); ctx.fillText(`ANALYZING  ${(62 + k*7 + u*6).toFixed(1)}%`, bx - bs, by - bs*.6 - 16); ctx.restore();
  // captions
  for (const [txt, at] of CAPS) textAt(txt, W/2, 1380, win(t, T_MIO + b(at), T_MIO + b(at + 2), .15), `900 76px ${SERIF}`, c(WHITE, 1), 'center', 'rgba(0,0,0,.9)');
  // name plate on the hero
  const np = sm(seg(t, T_MIO + b(4.3), T_MIO + b(5)));
  if (np > 0) { ctx.save(); ctx.globalAlpha = np; ctx.textAlign = 'left';
    ctx.fillStyle = c(RED, 1); ctx.fillRect(80, 1500, 6, 170);
    ctx.font = `500 26px ${SANS}`; ctx.fillStyle = c(WHITE, .85); ctx.fillText('東雲重工 全社技術審査委員会', 110, 1535);
    ctx.font = `600 34px ${SERIF}`; ctx.fillText('技術調査官', 110, 1590);
    ctx.font = `900 72px ${SERIF}`; ctx.fillStyle = c(WHITE, 1); ctx.fillText('硯川 澪', 110, 1665); ctx.restore(); }
  const f = Math.exp(-u*14); if (f > .03) { ctx.fillStyle = c(WHITE, .35*f); ctx.fillRect(0,0,W,H); }
  hud(t, 'INVESTIGATOR');
}

// ---------------- 4. title ----------------
function title(t){
  base(t, .6);
  const hero = graded[0];
  if (hero) { ctx.save(); ctx.globalAlpha = .22*(1 - .5*seg(t, T_TITLE, DUR)); const z = 1.05 + .05*seg(t, T_TITLE, DUR); ctx.translate(W/2, H/2); ctx.scale(z, z); ctx.drawImage(hero, -W/2, -H/2, W, H); ctx.restore();
    const g = ctx.createRadialGradient(W/2, H*.45, 200, W/2, H*.45, H*.7); g.addColorStop(0, 'rgba(7,9,13,.4)'); g.addColorStop(1, 'rgba(7,9,13,.97)'); ctx.fillStyle = g; ctx.fillRect(0,0,W,H); }
  const TY = 980, a = sm(seg(t, T_TITLE, T_TITLE + .3));
  const split = eOut(seg(t, T_TITLE + b(1), T_TITLE + b(1.6))) * 1;
  const gap = 10 + 34*split;
  // boundary line
  const ln = eOut(seg(t, T_TITLE + b(.9), T_TITLE + b(1.3)));
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const rg = ctx.createLinearGradient(W/2 - 60, 0, W/2 + 60, 0); rg.addColorStop(0, c(RED, 0)); rg.addColorStop(.5, c(RED, .35*ln)); rg.addColorStop(1, c(RED, 0));
  ctx.fillStyle = rg; ctx.fillRect(W/2 - 60, TY - 520*ln, 120, 1040*ln);
  ctx.strokeStyle = c(RED, ln); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(W/2, TY - 560*ln); ctx.lineTo(W/2, TY + 560*ln); ctx.stroke(); ctx.restore();
  ctx.save(); ctx.globalAlpha = a; ctx.font = `900 190px ${SERIF}`; ctx.textBaseline = 'middle'; ctx.fillStyle = c(WHITE, 1); ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 30;
  ctx.textAlign = 'right'; ctx.fillText('境界', W/2 - gap, TY);
  ctx.textAlign = 'left'; ctx.fillText('条件', W/2 + gap, TY); ctx.restore();
  const s2 = sm(seg(t, T_TITLE + b(2), T_TITLE + b(2.8)));
  if (s2 > 0) { ctx.save(); ctx.globalAlpha = s2; ctx.textAlign = 'center';
    ctx.font = `500 34px ${MONO}`; ctx.letterSpacing = '16px'; ctx.fillStyle = c(STEEL, 1); ctx.fillText('BOUNDARY CONDITIONS', W/2 + 8, TY + 190);
    ctx.letterSpacing = '6px'; ctx.font = `600 40px ${SERIF}`; ctx.fillStyle = c(WHITE, .92); ctx.fillText('技術ミステリー小説シリーズ', W/2 + 3, TY + 270);
    ctx.restore(); }
  const s3 = sm(seg(t, T_TITLE + b(3.2), T_TITLE + b(4)));
  textAt('事故は、正しさの隙間に宿る。', W/2, 1560, s3, `600 46px ${SERIF}`, c(WHITE, .85));
  hud(t, 'SERIES');
}

// ---------------- master ----------------
function draw(t){
  ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  const hits = [b(2), T_TWO + b(1), T_TWO + b(2), T_GAP + b(2), T_MIO, T_TITLE + b(1)];
  let k = 0; for (const h of hits) k += pulse(t, h, 12);
  for (let i = 0; i < 6; i++) k += .4*pulse(t, T_MIO + b(i), 16);
  ctx.setTransform(1,0,0,1, Math.sin(t*113)*k*10, Math.cos(t*97)*k*10);
  if (t < T_TWO) open(t); else if (t < T_MIO) two(t); else if (t < T_TITLE) mio(t); else title(t);
  ctx.setTransform(1,0,0,1,0,0);
  // red chromatic ghost on the gap reveal & title split
  const ch = pulse(t, T_GAP + b(2), 8) + pulse(t, T_TITLE + b(1), 8);
  if (ch > .02) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .25*ch; ctx.drawImage(cv, 12*ch, 0); ctx.restore(); }
  // transitions: quick fades to black at scene cuts
  for (const at of [T_TWO, T_MIO, T_TITLE]) { const x = Math.exp(-Math.pow((t - at)/.08, 2)); if (x > .02) { ctx.fillStyle = `rgba(0,0,0,${.85*x})`; ctx.fillRect(0,0,W,H); } }
  const vg = ctx.createRadialGradient(W/2, H/2, H*.32, W/2, H/2, H*.82); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.6)');
  ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.globalAlpha = .07; ctx.globalCompositeOperation = 'overlay'; const r = rng(Math.floor(t*24) + 1);
  for (let i = 0; i < 1600; i++) { const v = r() < .5 ? 0 : 255; ctx.fillStyle = `rgb(${v},${v},${v})`; ctx.fillRect(r()*W, r()*H, 2, 2); } ctx.restore();
  const fi = 1 - seg(t, 0, .4), fo = seg(t, 14.5, 15); if (fi + fo > 0) { ctx.fillStyle = `rgba(0,0,0,${Math.max(fi, fo*.8)})`; ctx.fillRect(0,0,W,H); }
}

// ---------------- sound: 96 BPM thriller ----------------
function buildAudio(ac, out){
  const T0 = ac.currentTime + .1, sr = ac.sampleRate;
  const master = ac.createGain(); master.gain.value = .55;
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 5; comp.attack.value = .003; comp.release.value = .1;
  const post = ac.createGain(); post.gain.value = .55; master.connect(comp); comp.connect(post); post.connect(out);
  const ir = ac.createBuffer(2, sr*4, sr); for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1)*Math.pow(1 - i/d.length, 2.6); }
  const verb = ac.createConvolver(); verb.buffer = ir; const vg = ac.createGain(); vg.gain.value = .4; verb.connect(vg); vg.connect(master);
  const wn = ac.createBuffer(1, sr*2, sr); { const d = wn.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2-1; }
  const send = (n, a) => { const s = ac.createGain(); s.gain.value = a; n.connect(s); s.connect(verb); };
  const env = (g, at, pk, a, h, r) => { g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(pk, at+a); g.gain.setValueAtTime(pk, at+a+h); g.gain.exponentialRampToValueAtTime(.0001, at+a+h+r); };
  const osc = (type, f, at, end, dest) => { const o = ac.createOscillator(); o.type = type; o.frequency.value = f; o.connect(dest); o.start(at); o.stop(end); return o; };
  const nz = (at, dur, type, f, q, pk, rel, rev = 0) => { const n = ac.createBufferSource(); n.buffer = wn; const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
    const g = ac.createGain(); env(g, at, pk, .002, dur, rel); n.connect(fl); fl.connect(g); g.connect(master); if (rev) send(g, rev); n.start(at, Math.random()); n.stop(at + dur + rel + .1); return fl; };
  const hz = n => 440*Math.pow(2, (n - 69)/12);
  const kick = (at, pk = 1) => { const g = ac.createGain(); env(g, at, pk, .002, .02, .35); g.connect(master); const o = osc('sine', 140, at, at + .45, g); o.frequency.setValueAtTime(150, at); o.frequency.exponentialRampToValueAtTime(40, at + .14); };
  const boom = (at, pk, f0, f1, len) => { const g = ac.createGain(); env(g, at, pk, .004, .08, len); g.connect(master); const o = osc('sine', f0, at, at + len + .3, g); o.frequency.setValueAtTime(f0, at); o.frequency.exponentialRampToValueAtTime(f1, at + len*.7); };
  const tick = (at, pk = .12, f = 2400) => nz(at, .002, 'bandpass', f, 9, pk, .03, .2);
  const rim = (at, pk = .3) => { nz(at, .004, 'bandpass', 1700, 4, pk, .06, .3); const g = ac.createGain(); env(g, at, pk*.5, .001, 0, .05); g.connect(master); osc('triangle', 820, at, at + .08, g); };
  const piano = (at, n, vel = .15, len = 2.4) => { const g = ac.createGain(), lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(3500, at); lp.frequency.exponentialRampToValueAtTime(700, at + len);
    g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(vel, at + .006); g.gain.exponentialRampToValueAtTime(vel*.3, at + .4); g.gain.exponentialRampToValueAtTime(.0001, at + len);
    lp.connect(g); g.connect(master); send(g, .9); osc('triangle', hz(n), at, at + len, lp).detune.value = -3; osc('sine', hz(n)*2, at, at + len*.5, lp).detune.value = 4; };
  const stamp = at => { boom(at, .6, 120, 50, .15); nz(at, .01, 'lowpass', 900, .7, .6, .1); nz(at + .005, .004, 'highpass', 3000, .7, .2, .05); };
  const drone = (t0, t1, notes, pk) => { const g = ac.createGain(), lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700;
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(pk, t0 + 1); g.gain.setValueAtTime(pk, t1 - .4); g.gain.linearRampToValueAtTime(0, t1); lp.connect(g); g.connect(master); send(g, .7);
    for (const n of notes) for (const d of [-6, 6]) osc('sawtooth', hz(n), t0, t1 + .1, lp).detune.value = d; };

  // 1. open: clock ticks, typing, a low heartbeat, the "誰のせいでもなかった" hit
  drone(T0, T0 + T_MIO, [38, 45], .05);                                     // D2 A2
  for (let i = 0; i < 16; i++) tick(T0 + i*BT/2, i % 2 ? .06 : .1);
  for (let i = 0; i < 4; i++) tick(T0 + .45 + i*.1, .12, 3200);
  for (let i = 0; i < 11; i++) tick(T0 + b(2) + i*.083, .1, 3000);
  boom(T0 + b(2), .6, 70, 38, .6); piano(T0 + b(2), 50, .16);             // D3
  piano(T0 + b(3), 53, .1);
  // 2. two judgements: stamps, then the panels close; glass ping at the gap
  stamp(T0 + T_TWO + b(1)); piano(T0 + T_TWO + b(1), 57, .1);
  stamp(T0 + T_TWO + b(2)); piano(T0 + T_TWO + b(2), 60, .1);
  for (let i = 0; i < 16; i++) { tick(T0 + T_TWO + i*BT/2, i % 2 ? .06 : .1); if (i % 4 === 0) kick(T0 + T_TWO + i*BT/2, .45); }
  { const n = ac.createBufferSource(); n.buffer = wn; n.loop = true; const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 4; const at = T0 + T_GAP, e = at + b(2);
    bp.frequency.setValueAtTime(200, at); bp.frequency.exponentialRampToValueAtTime(3000, e); const g = ac.createGain(); g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(.14, e - .02); g.gain.linearRampToValueAtTime(0, e + .02);
    n.connect(bp); bp.connect(g); g.connect(master); n.start(at); n.stop(e + .1); }
  { const at = T0 + T_GAP + b(2); boom(at, .9, 90, 30, 1.2); nz(at, .02, 'highpass', 2500, .7, .35, .6, .7);
    const g = ac.createGain(); env(g, at, .1, .002, 0, 2.5); g.connect(master); send(g, 1.2); for (const f of [1567, 2217, 3135]) osc('sine', f, at, at + 2.6, g); }
  piano(T0 + T_GAP + b(2), 51, .14, 3);                                      // Eb3: the wrong note
  // 3. Mio: half-time beat enters
  for (let i = 0; i < 6; i++) { const at = T0 + T_MIO + b(i);
    kick(at, i === 0 ? 1.1 : .85); if (i % 2) rim(at, .35);
    for (let s = 0; s < 4; s++) tick(at + s*BT/4, s % 2 ? .05 : .09, 8000);
    if (i % 2 === 0) nz(at + b(.75), .003, 'highpass', 7000, .7, .1, .12);
    const bg = ac.createGain(); env(bg, at, .22, .01, BT*.5, .15); const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 300; lp.connect(bg); bg.connect(master);
    osc('sawtooth', hz([38, 38, 41, 41, 36, 36][i]), at, at + BT, lp);
    nz(at - .06, .06, 'bandpass', 2500, 1.5, .08, .05); }                   // cut whoosh
  [[0, 62], [1.5, 65], [2, 69], [3.5, 67], [4, 65], [5, 64]].forEach(([bt, n]) => piano(T0 + T_MIO + b(bt), n, .09, 1.6));
  drone(T0 + T_MIO, T0 + T_TITLE, [38, 50, 57], .04);
  // 4. title: the split
  { const at = T0 + T_TITLE; nz(at - b(.5), .01, 'highpass', 5000, .7, .0, .0); }
  const S = T0 + T_TITLE + b(1);
  kick(S, 1.2); boom(S, 1, 80, 28, 1.6); nz(S, .03, 'highpass', 3000, .7, .4, 1.2, .9);
  { const g = ac.createGain(); g.gain.setValueAtTime(0, S); g.gain.linearRampToValueAtTime(.14, S + .05); g.gain.setTargetAtTime(.0001, S + .6, .8); g.connect(master); send(g, 1);
    for (const n of [38, 45, 50, 53, 57, 63]) for (const d of [-8, 8]) osc('sawtooth', hz(n), S, T0 + 15, g).detune.value = d; }          // Dm(add b9) cluster
  piano(T0 + T_TITLE + b(3.2), 62, .12, 2.5); piano(T0 + T_TITLE + b(3.2) + .02, 69, .09, 2.5);
  for (let i = 0; i < 8; i++) tick(T0 + T_TITLE + b(2) + i*BT/2, .05);
  master.gain.setValueAtTime(.55, T0 + 14.2); master.gain.linearRampToValueAtTime(.0001, T0 + 15);
  return T0;
}

let ac = null, t0 = 0, raf = 0;
function loop(){ const t = Math.min(DUR, ac.currentTime - t0); draw(Math.max(0,t)); statusEl.textContent = `${Math.max(0,t).toFixed(2)} / 15.00s`;
  if (t < DUR) raf = requestAnimationFrame(loop); }
document.getElementById('play').onclick = () => { cancelAnimationFrame(raf); if (ac) ac.close(); ac = new AudioContext(); t0 = buildAudio(ac, ac.destination); loop(); };
window.renderFrame = draw; window.buildAudio = buildAudio;
const loads = Object.entries(IMGS).map(([k, src]) => new Promise(res => { const im = new Image(); im.onload = () => { img[k] = im; res(); }; im.onerror = res; im.src = src; }));
Promise.all([...loads, document.fonts.load(`900 96px ${SERIF}`, '境界条件'), document.fonts.load(`600 40px ${SERIF}`, '技術'), document.fonts.load(`700 40px ${SANS}`, '判断'),
  document.fonts.load(`500 26px ${SANS}`, '東雲'), document.fonts.load(`500 22px ${MONO}`, 'CASE')]).catch(()=>{}).then(() => {
  prep(); draw(T_GAP + b(3)); document.getElementById('play').disabled = false; statusEl.textContent = '▶ で再生'; window.ready = true;
});
})();
</script>
</body>
</html>
